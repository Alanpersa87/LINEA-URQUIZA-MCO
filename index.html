<html lang="es">
<head>

  <title>Registro de Trenes - Línea Urquiza</title>
  <style>
    :root {
      --primary-color: #60a5fa;
      --secondary-color: #22c55e;
      --bg-main: #0b1329;
      --bg-overlay: rgba(15, 23, 42, 0.95);
      --card-bg: rgba(20, 30, 55, 0.9);
      --text-color: #f1f5f9;
      --border-color: rgba(96, 165, 250, 0.3);
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg-overlay);
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      position: relative;
      border: 1px solid var(--border-color);
    }

    <h1>Registro de Trenes - Línea Urquiza</h1>
  </div>

  <div class="header-bar">
    <button type="button" class="btn-cal" onclick="abrirCalendario()">📅 Calendario</button>
    <button type="button" class="btn-cal" style="background:#0284c7;" onclick="abrirCalculadorTramos()">⏱️ Tiempos</button>
  </div> 

  <form id="registroForm">
    <div class="section">
      <div class="section-title">1. Datos Generales y Tomada de Servicio</div>
      
      <!-- TOMADA DE SERVICIO (FECHA CALENDARIO + HORA TIPO ROLLO) -->
      <div class="row">
        <div class="col">
          <label>Fecha Tomada:</label>
          <input type="date" id="tomada_fecha" onchange="calcularServicio()" required>
        </div>
        <div class="col">
          <label>Hora Tomada:</label>
          <input type="time" id="tomada_hora" onchange="calcularServicio()" required>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Lugar Tomada Servicio:</label>
          <select id="lugar_tomada" onchange="calcularServicio()">
            <option value="Concordia">Concordia (Residencia)</option>
            <option value="Monte Caseros">Monte Caseros</option>
            <option value="Basavilbaso">Basavilbaso</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Maquinista:</label>
          <input type="text" id="maquinista" placeholder="Nombre" required>
        </div>
        <div class="col">
          <label>Legajo Maq.:</label>
          <input type="number" id="legajo_maquinista" placeholder="N° Legajo" required>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>Jefe de Tren:</label>
          <input type="text" id="jefe_tren" placeholder="Nombre" required>
        </div>
        <div class="col">
          <label>Legajo Jefe:</label>
          <input type="number" id="legajo_jefe" placeholder="N° Legajo" required>
        </div>
      </div>
    </div> 

    <!-- 2. DATOS DEL TREN (REORGANIZABLES / DRAGGABLE) -->
    <div class="section">
      <div class="section-title">2. Datos del Tren (Arrastrables)</div>
      <div id="train-data-container">
        <div class="draggable-field" draggable="true">
          <label>Tren (Prefijo):</label>
          <input type="number" id="tren_prefijo" placeholder="Ej: 5001" required>
        </div>
        <div class="draggable-field" draggable="true">
          <label>Locomotora:</label>
          <input type="number" id="locomotora" placeholder="N° Locomotora" required>
        </div>
        <div class="draggable-field" draggable="true">
          <label>Toneladas:</label>
          <input type="number" id="toneladas" placeholder="Tn">
        </div>
        <div class="draggable-field" draggable="true">
          <label>Longitud (m):</label>
          <input type="number" id="longitud" placeholder="Metros">
        </div>
        <div class="draggable-field" draggable="true">
          <label>Vagones Vacíos:</label>
          <input type="number" id="vagones_vacios" value="0">
        </div>
        <div class="draggable-field" draggable="true">
          <label>Vagones Cargados:</label>
          <input type="number" id="vagones_cargados" value="0">
        </div>
        <div class="draggable-field" draggable="true">
          <label>EOT:</label>
          <input type="number" id="eot" placeholder="N° EOT">
        </div>
        <div class="draggable-field" draggable="true">
          <label>Orden de Trabajo:</label>
          <input type="number" id="orden_trabajo" placeholder="N° OT">
        </div>
        <div class="draggable-field" draggable="true">
          <label>Último Vehículo:</label>
          <input type="number" id="ultimo_vehiculo" placeholder="N° Vehículo">
        </div>
      </div>
    </div> 

    <!-- 3. AUV ALFANUMÉRICO -->
    <div class="section">
      <div class="section-title">3. Autorizaciones de Uso de Vía (AUV)</div>
      <div id="auv_container"></div>
      <button type="button" class="btn-add" onclick="agregarAUV()">+ Agregar AUV</button>
    </div> 

    <!-- 4. CRUCE DE TRENES -->
    <div class="section">
      <div class="section-title">4. Cruce de Trenes</div>
      <div id="cruce_container"></div>
      <button type="button" class="btn-add" onclick="agregarCruce()">+ Agregar Cruce</button>
    </div> 

    <!-- 5. CORRIDA DE ESTACIONES -->
    <div class="section">
      <div class="section-title">5. Corrida de Estaciones</div>
      <div class="row">
        <div class="col">
          <label>Tramo:</label>
          <select id="tramo_select" onchange="cargarEstaciones()">
            <option value="MCO-MMK">Concordia -> Monte Caseros (MCO - MMK)</option>
            <option value="MMK-MCO">Monte Caseros -> Concordia (MMK - MCO)</option>
            <option value="MCO-MBA">Concordia -> Basavilbaso (MCO - MBA)</option>
            <option value="MBA-MCO">Basavilbaso -> Concordia (MBA - MCO)</option>
          </select>
        </div>
      </div>
      <div id="estaciones_container"></div>
    </div> 

    <!-- 6. OBSERVACIONES -->
    <div class="section">
      <div class="section-title">6. Observaciones</div>
      <textarea id="observaciones" rows="4" placeholder="Anotaciones u observaciones del viaje..."></textarea>
    </div> 

    <!-- 7. DEJADA DE SERVICIO Y VIÁTICOS -->
    <div class="section">
      <div class="section-title">7. Dejada de Servicio y Viáticos</div>
      <div class="row">
        <div class="col">
          <label>Lugar Dejada Servicio:</label>
          <select id="lugar_dejada" onchange="calcularServicio()">
            <option value="Concordia">Concordia (Residencia)</option>
            <option value="Monte Caseros">Monte Caseros</option>
            <option value="Basavilbaso">Basavilbaso</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div> 

      <!-- DEJADA DE SERVICIO (FECHA CALENDARIO + HORA TIPO ROLLO) -->
      <div class="row" style="margin-top: 10px;">
        <div class="col">
          <label>Fecha Dejada:</label>
          <input type="date" id="dejada_fecha" onchange="calcularServicio()">
        </div>
        <div class="col">
          <label>Hora Dejada:</label>
          <input type="time" id="dejada_hora" onchange="calcularServicio()">
        </div>
      </div>

      <div class="summary-box">
        <div><strong>Estado del Servicio:</strong> <span id="tipo_servicio">Servicio Local</span></div>
        <div><strong>Horas Foja Actual:</strong> <span id="horas_trabajadas">0 hs</span></div>
        <div><strong>Horas Extras Foja:</strong> <span id="horas_extras">0 hs</span></div>
        <div><strong>Viático Computado:</strong> <span id="viatico_status">Pendiente</span></div>
      </div>
    </div> 

    <button type="button" class="btn-save" onclick="guardarRegistro()">Guardar Foja y Recalcular</button>
    <button type="button" class="btn-reset" onclick="reiniciarFormulario()">Limpiar Formulario</button>
  </form> 

  <hr style="margin: 20px 0; border-color: var(--border-color);"> 

  <h2>Historial Detallado de Fojas</h2>
  <div class="summary-box">
    <div><strong>Total Horas Extras Acumuladas:</strong> <span id="total_horas_extras">0.00 hs</span></div>
    <div><strong>Total Días de Viático Liquidados (24hs):</strong> <span id="total_viaticos">0.00 días</span></div>
  </div> 

  <div id="historial_container" style="margin-top: 15px;"></div>

  <!-- MARCA REGISTRADA BIEN ABAJO (2 VECES MÁS CHICA) -->
  <div class="watermark-footer">Hecho por Alán Rodrigo Martinez</div>
</div> 

<div id="modalCalendario" class="modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Calendario de Servicios</h3>
      <button type="button" onclick="cerrarCalendario()" style="background:#ef4444; color:white;">X</button>
    </div>
    <div class="legend">
      <span><span class="badge" style="background:#22c55e;"></span> Servicio Local</span>
      <span><span class="badge" style="background:#3b82f6;"></span> Viático / En Viaje</span>
    </div>
    <div class="calendar-grid" id="gridCalendario"></div>
    <div id="detalleDia" style="margin-top: 15px; font-size:0.85em;" class="summary-box">
      <em>Toca un día cargado para ver sus detalles.</em>
    </div>
  </div>
</div> 

<div id="modalTramos" class="modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0;">Calcular Tiempo entre Estaciones</h3>
      <button type="button" onclick="cerrarCalculadorTramos()" style="background:#ef4444; color:white;">X</button>
    </div>
    <div class="row">
      <div class="col">
        <label>Desde Estación:</label>
        <select id="tramo_origen" onchange="calcularTiempoTramo()"></select>
      </div>
      <div class="col">
        <label>Hasta Estación:</label>
        <select id="tramo_destino" onchange="calcularTiempoTramo()"></select>
      </div>
    </div>
    <div class="summary-box" style="text-align: center; margin-top: 15px;">
      <div style="font-size: 0.9em; color: #94a3b8;">Tiempo de recorrido:</div>
      <div id="resultado_tramo" style="font-size: 1.4em; font-weight: bold; color: var(--primary-color); margin-top: 5px;">--:-- hs</div>
    </div>
  </div>
</div> 

<script>
  const tramos = {
    'MCO-MMK': ['MCO', 'MOM', 'MCR', 'MIS', 'MFE', 'MAN', 'MCH', 'MMO', 'MLE', 'MMK'],
    'MMK-MCO': ['MMK', 'MLE', 'MMO', 'MCH', 'MAN', 'MFE', 'MIS', 'MCR', 'MOM', 'MCO'],
    'MCO-MBA': ['MCO', 'MYU', 'MYE', 'MGC', 'MDA', 'MSS', 'MAA', 'MVE', 'MDO', 'MGU', 'MBA'],
    'MBA-MCO': ['MBA', 'MGU', 'MDO', 'MVE', 'MAA', 'MSS', 'MDA', 'MGC', 'MYE', 'MYU', 'MCO']
  }; 

  let registrosGuardados = JSON.parse(localStorage.getItem('registros_trenes')) || []; 

  window.onload = function() {
    const ahora = new Date();
    const fechaIso = ahora.toISOString().split('T')[0];
    const horaStr = String(ahora.getHours()).padStart(2, '0') + ':' + String(ahora.getMinutes()).padStart(2, '0');
    
    document.getElementById('tomada_fecha').value = fechaIso;
    document.getElementById('tomada_hora').value = horaStr; 

    cargarEstaciones();
    configurarDragAndDrop();
    recalcularTodo();
  }; 

  function configurarDragAndDrop() {
    const container = document.getElementById('train-data-container');
    let draggedElement = null; 

    container.addEventListener('dragstart', (e) => {
      draggedElement = e.target.closest('.draggable-field');
      e.dataTransfer.effectAllowed = 'move';
    }); 

    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      const target = e.target.closest('.draggable-field');
      if (target && target !== draggedElement) {
        const rect = target.getBoundingClientRect();
        const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
        container.insertBefore(draggedElement, next ? target.nextSibling : target);
      }
    });
  } 

  function agregarAUV() {
    const container = document.getElementById('auv_container');
    const div = document.createElement('div');
    div.className = 'auv-item';
    div.innerHTML = `
      <input type="text" placeholder="Código AUV (Ej: 5432mchp)" class="auv_val">
      <button type="button" style="background:#ef4444; color:white;" onclick="this.parentElement.remove()">X</button>
    `;
    container.appendChild(div);
  } 

  function agregarCruce() {
    const container = document.getElementById('cruce_container');
    const div = document.createElement('div');
    div.className = 'cruce-item';
    div.innerHTML = `
      <input type="text" placeholder="Patio de cruce" class="cruce-patio" style="flex:1;">
      <input type="text" placeholder="Tren que cruza" class="cruce-tren" style="flex:1;">
      <button type="button" style="background:#ef4444; color:white;" onclick="this.parentElement.remove()">X</button>
    `;
    container.appendChild(div);
  } 

  function cargarEstaciones() {
    const tramo = document.getElementById('tramo_select').value;
    const lista = tramos[tramo];
    const container = document.getElementById('estaciones_container');
    container.innerHTML = ''; 

    lista.forEach(est => {
      const div = document.createElement('div');
      div.className = 'estacion-item';
      div.innerHTML = `
        <span style="width: 60px; font-weight: bold;">${est}:</span>
        <input type="text" id="est_${est}" placeholder="HH:MM" maxlength="5" inputmode="numeric" oninput="formatearHoraInput(this)" onchange="actualizarSelectoresTramo()">
        <button type="button" style="background:#334155; color:#f1f5f9;" onclick="marcarHoraEstacion('est_${est}')">Hora Actual</button>
      `;
      container.appendChild(div);
    });
    poblarSelectoresTramos();
  } 

  function formatearHoraInput(input) {
    let val = input.value.replace(/[^0-9]/g, '');
    if (val.length > 4) val = val.slice(0, 4);
    if (val.length >= 3) {
      input.value = val.slice(0, 2) + ':' + val.slice(2);
    } else {
      input.value = val;
    }
    actualizarSelectoresTramo();
  } 

  function marcarHoraEstacion(id) {
    const ahora = new Date();
    const hh = String(ahora.getHours()).padStart(2, '0');
    const mm = String(ahora.getMinutes()).padStart(2, '0');
    document.getElementById(id).value = `${hh}:${mm}`;
    actualizarSelectoresTramo();
  } 

  function poblarSelectoresTramos() {
    const tramo = document.getElementById('tramo_select').value;
    const lista = tramos[tramo];
    const selOrigen = document.getElementById('tramo_origen');
    const selDestino = document.getElementById('tramo_destino'); 

    if (!selOrigen || !selDestino) return; 

    selOrigen.innerHTML = '';
    selDestino.innerHTML = ''; 

    lista.forEach(est => {
      selOrigen.add(new Option(est, est));
      selDestino.add(new Option(est, est));
    }); 

    if(lista.length > 1) selDestino.selectedIndex = 1;
    calcularTiempoTramo();
  } 

  function abrirCalculadorTramos() {
    document.getElementById('modalTramos').style.display = 'flex';
    poblarSelectoresTramos();
  } 

  function cerrarCalculadorTramos() {
    document.getElementById('modalTramos').style.display = 'none';
  } 

  function calcularTiempoTramo() {
    const origen = document.getElementById('tramo_origen').value;
    const destino = document.getElementById('tramo_destino').value;
    const tramo = document.getElementById('tramo_select').value;
    const lista = tramos[tramo]; 

    const idxOrigen = lista.indexOf(origen);
    const idxDestino = lista.indexOf(destino);
    const resBox = document.getElementById('resultado_tramo'); 

    if (idxOrigen >= idxDestino) {
      resBox.innerText = "Tramo inválido";
      return;
    } 

    const valOrigen = document.getElementById('est_' + origen).value;
    const valDestino = document.getElementById('est_' + destino).value; 

    if (!valOrigen || !valDestino || !valOrigen.includes(':') || !valDestino.includes(':')) {
      resBox.innerText = "Formato incompleto";
      return;
    } 

    const [h1, m1] = valOrigen.split(':').map(Number);
    const [h2, m2] = valDestino.split(':').map(Number); 

    let minutos1 = h1 * 60 + m1;
    let minutos2 = h2 * 60 + m2; 

    if (minutos2 < minutos1) {
      minutos2 += 24 * 60;
    } 

    const diffMin = minutos2 - minutos1;
    const horasRes = Math.floor(diffMin / 60);
    const minsRes = diffMin % 60; 

    resBox.innerText = `${horasRes} hs ${minsRes} min`;
  } 

  function actualizarSelectoresTramo() {
    if(document.getElementById('modalTramos').style.display === 'flex') {
      calcularTiempoTramo();
    }
  } 

  function calcularServicio() {
    const fechaTomada = document.getElementById('tomada_fecha').value;
    const horaTomada = document.getElementById('tomada_hora').value;
    const fechaDejada = document.getElementById('dejada_fecha').value;
    const horaDejada = document.getElementById('dejada_hora').value;
    const lugarTomada = document.getElementById('lugar_tomada').value;
    const lugarDejada = document.getElementById('lugar_dejada').value; 

    if (!fechaTomada || !horaTomada || !fechaDejada || !horaDejada) {
      document.getElementById('tipo_servicio').innerText = "Incompleto";
      document.getElementById('horas_trabajadas').innerText = "0 hs";
      document.getElementById('horas_extras').innerText = "0 hs";
      document.getElementById('viatico_status').innerText = "Pendiente";
      return { horasExtras: 0 };
    } 

    const tomada = new Date(fechaTomada + 'T' + horaTomada);
    const dejada = new Date(fechaDejada + 'T' + horaDejada);
    const diffMs = dejada - tomada; 

    if (diffMs <= 0) {
      document.getElementById('horas_trabajadas').innerText = "Error fechas";
      return { horasExtras: 0 };
    } 

    const totalHoras = diffMs / (1000 * 60 * 60);
    const horasExtras = totalHoras > 8 ? (totalHoras - 8) : 0; 

    document.getElementById('horas_trabajadas').innerText = totalHoras.toFixed(2) + " hs";
    document.getElementById('horas_extras').innerText = horasExtras.toFixed(2) + " hs";
    
    const esLocal = (lugarTomada === 'Concordia' && lugarDejada === 'Concordia');
    document.getElementById('tipo_servicio').innerText = esLocal ? "Servicio Local" : "Servicio Fuera de Residencia"; 

    return { horasExtras };
  } 

  function guardarRegistro() {
    const fechaTomada = document.getElementById('tomada_fecha').value;
    const horaTomada = document.getElementById('tomada_hora').value;
    const fechaDejada = document.getElementById('dejada_fecha').value;
    const horaDejada = document.getElementById('dejada_hora').value;

    if (!fechaTomada || !horaTomada) {
      alert("Por favor completa la fecha y hora de tomada de servicio.");
      return;
    }
    if (!fechaDejada || !horaDejada) {
      alert("Por favor completa la fecha y hora de dejada de servicio.");
      return;
    } 

    const tomadaVal = fechaTomada + 'T' + horaTomada;
    const dejadaVal = fechaDejada + 'T' + horaDejada;

    const { horasExtras } = calcularServicio();
    const auvs = Array.from(document.querySelectorAll('.auv_val')).map(i => i.value).filter(v => v);
    
    const cruces = Array.from(document.querySelectorAll('.cruce-item')).map(i => {
      return { patio: i.querySelector('.cruce-patio').value, tren: i.querySelector('.cruce-tren').value };
    }).filter(c => c.patio || c.tren); 

    const tramo = document.getElementById('tramo_select').value;
    const estacionesCorrida = tramos[tramo].map(est => {
      return { estacion: est, hora: document.getElementById('est_' + est).value };
    }); 

    const registro = {
      id: Date.now(),
      fecha: fechaTomada,
      tomada_servicio: tomadaVal,
      dejada_servicio: dejadaVal,
      lugar_tomada: document.getElementById('lugar_tomada').value,
      lugar_dejada: document.getElementById('lugar_dejada').value,
      maquinista: document.getElementById('maquinista').value,
      legajo_maquinista: document.getElementById('legajo_maquinista').value,
      jefe_tren: document.getElementById('jefe_tren').value,
      legajo_jefe: document.getElementById('legajo_jefe').value,
      tren_prefijo: document.getElementById('tren_prefijo').value,
      locomotora: document.getElementById('locomotora').value,
      toneladas: document.getElementById('toneladas').value,
      longitud: document.getElementById('longitud').value,
      vagones_vacios: document.getElementById('vagones_vacios').value,
      vagones_cargados: document.getElementById('vagones_cargados').value,
      eot: document.getElementById('eot').value,
      orden_trabajo: document.getElementById('orden_trabajo').value,
      ultimo_vehiculo: document.getElementById('ultimo_vehiculo').value,
      horas_extras: horasExtras,
      viatico_dias: 0,
      auvs: auvs,
      cruces: cruces,
      estaciones: estacionesCorrida,
      observaciones: document.getElementById('observaciones').value
    }; 

    registrosGuardados.push(registro);
    recalcularTodo(); 

    alert("Foja guardada exitosamente.");
    reiniciarFormulario();
  } 

  function reiniciarFormulario() {
    document.getElementById('registroForm').reset();
    document.getElementById('auv_container').innerHTML = '';
    document.getElementById('cruce_container').innerHTML = '';
    
    const ahora = new Date();
    const fechaIso = ahora.toISOString().split('T')[0];
    const horaStr = String(ahora.getHours()).padStart(2, '0') + ':' + String(ahora.getMinutes()).padStart(2, '0');
    
    document.getElementById('tomada_fecha').value = fechaIso;
    document.getElementById('tomada_hora').value = horaStr;
    
    cargarEstaciones();
    calcularServicio();
  } 

  function recalcularTodo() {
    registrosGuardados.sort((a,b) => new Date(a.tomada_servicio) - new Date(b.tomada_servicio)); 

    let inicioCiclo = null; 

    registrosGuardados.forEach(reg => {
      const esLocal = (reg.lugar_tomada === 'Concordia' && reg.lugar_dejada === 'Concordia');
      reg.esLocal = esLocal; 

      if (reg.lugar_tomada === 'Concordia' && reg.lugar_dejada !== 'Concordia') {
        inicioCiclo = new Date(reg.tomada_servicio);
        reg.viatico_dias = 0;
        reg.estado_ciclo = "En Viaje (Abierto)";
      } 
      else if (reg.lugar_tomada !== 'Concordia' && reg.lugar_dejada === 'Concordia') {
        const finCiclo = new Date(reg.dejada_servicio);
        if (inicioCiclo && finCiclo > inicioCiclo) {
          const totalMs = finCiclo - inicioCiclo;
          const totalHs = totalMs / (1000 * 60 * 60);
          reg.viatico_dias = totalHs / 24;
          reg.horas_ciclo = totalHs;
          reg.estado_ciclo = `Cierre Ciclo (${totalHs.toFixed(1)} hs totales)`;
          inicioCiclo = null;
        } else {
          const hsFoja = (new Date(reg.dejada_servicio) - new Date(reg.tomada_servicio)) / (1000 * 60 * 60);
          reg.viatico_dias = hsFoja / 24;
          reg.estado_ciclo = "Regreso directo";
        }
      } 
      else if (esLocal) {
        const hsFoja = (new Date(reg.dejada_servicio) - new Date(reg.tomada_servicio)) / (1000 * 60 * 60);
        if (hsFoja >= 20) {
          reg.viatico_dias = hsFoja / 24;
          reg.estado_ciclo = "Local (>=20hs)";
        } else {
          reg.viatico_dias = 0;
          reg.estado_ciclo = "Local (<20hs)";
        }
      } else {
        reg.viatico_dias = 0;
        reg.estado_ciclo = "Tramo Intermedio";
      }
    });

    localStorage.setItem('registros_trenes', JSON.stringify(registrosGuardados));
    actualizarHistorialYAcumulados();
  } 

  // Historial Plegable con colores oscuros diferenciados
  function actualizarHistorialYAcumulados() {
    const container = document.getElementById('historial_container');
    container.innerHTML = ''; 

    let totalExtras = 0;
    let totalViaticosDias = 0; 

    registrosGuardados.slice().reverse().forEach((reg) => {
      totalExtras += reg.horas_extras || 0;
      totalViaticosDias += reg.viatico_dias || 0; 

      const dateObj = new Date(reg.fecha + "T00:00:00");
      const fechaFormateada = dateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }); 

      let estacionesHtml = reg.estaciones ? reg.estaciones.map(e => `${e.estacion}: ${e.hora || '--:--'}`).join(' | ') : '';
      let auvsHtml = reg.auvs && reg.auvs.length > 0 ? reg.auvs.join(', ') : 'Ninguna';
      let crucesHtml = reg.cruces && reg.cruces.length > 0 ? reg.cruces.map(c => `${c.patio} -> ${c.tren}`).join('; ') : 'Ninguno'; 

      const card = document.createElement('div');
      card.className = reg.esLocal ? 'history-card card-local' : 'history-card card-viatico';

      card.innerHTML = `
        <div class="history-header" onclick="toggleDetalle(${reg.id})">
          <span>📅 ${fechaFormateada} (${reg.lugar_tomada} ➔ ${reg.lugar_dejada})</span>
          <span style="font-size: 0.8em; opacity: 0.8;">Tocar para ver ▼</span>
        </div>
        <div id="details-${reg.id}" class="history-details">
          <div><strong>Tomada:</strong> ${reg.lugar_tomada} (${reg.tomada_servicio ? reg.tomada_servicio.replace('T', ' ') : '-'})</div>
          <div><strong>Dejada:</strong> ${reg.lugar_dejada} (${reg.dejada_servicio ? reg.dejada_servicio.replace('T', ' ') : 'En curso'})</div>
          <div><strong>Tren / Loc:</strong> ${reg.tren_prefijo || '-'} / ${reg.locomotora || '-'}</div>
          <div><strong>Personal:</strong> Maq: ${reg.maquinista} (${reg.legajo_maquinista}) | Jefe: ${reg.jefe_tren} (${reg.legajo_jefe})</div>
          <div><strong>AUV:</strong> ${auvsHtml}</div>
          <div><strong>Cruces:</strong> ${crucesHtml}</div>
          <div style="margin: 4px 0; font-size: 0.85em; background: rgba(30, 41, 59, 0.8); padding: 4px; border-radius: 4px;"><strong>Estaciones:</strong> ${estacionesHtml}</div>
          <div><strong>Hs Extras:</strong> ${reg.horas_extras ? reg.horas_extras.toFixed(2) : 0} hs | <strong>Viático:</strong> <span style="color:#f59e0b; font-weight:bold;">${reg.viatico_dias ? reg.viatico_dias.toFixed(2) + ' días' : 'En Viaje / Pendiente'}</span></div>
          ${reg.observaciones ? `<div><strong>Obs:</strong> ${reg.observaciones}</div>` : ''}
          <button type="button" style="background:#ef4444; color:white; padding:4px 10px; margin-top:8px;" onclick="eliminarRegistro(${reg.id})">Eliminar Foja</button>
        </div>
      `;
      container.appendChild(card);
    });

    document.getElementById('total_horas_extras').innerText = totalExtras.toFixed(2) + " hs";
    document.getElementById('total_viaticos').innerText = totalViaticosDias.toFixed(2) + " días (" + (totalViaticosDias * 24).toFixed(1) + " hs)";
  } 

  function toggleDetalle(id) {
    const el = document.getElementById(`details-${id}`);
    el.classList.toggle("active");
  } 

  function eliminarRegistro(id) {
    if(confirm("¿Seguro deseas eliminar esta foja?")) {
      registrosGuardados = registrosGuardados.filter(r => r.id !== id);
      recalcularTodo();
    }
  } 

  function abrirCalendario() {
    document.getElementById('modalCalendario').style.display = 'flex';
    renderCalendario();
  } 

  function cerrarCalendario() {
    document.getElementById('modalCalendario').style.display = 'none';
  } 

  function renderCalendario() {
    const grid = document.getElementById('gridCalendario');
    grid.innerHTML = ''; 

    const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    diasSemana.forEach(d => {
      const h = document.createElement('div');
      h.className = 'cal-header';
      h.innerText = d;
      grid.appendChild(h);
    }); 

    const ahora = new Date();
    const anio = ahora.getFullYear();
    const mes = ahora.getMonth(); 

    const primerDia = new Date(anio, mes, 1).getDay();
    const totalDias = new Date(anio, mes + 1, 0).getDate(); 

    for (let i = 0; i < primerDia; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    } 

    for (let d = 1; d <= totalDias; d++) {
      const fechaStr = `${anio}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const reg = registrosGuardados.find(r => r.fecha === fechaStr); 

      const cell = document.createElement('div');
      cell.className = 'cal-day';
      cell.innerText = d; 

      if (reg) {
        if (reg.esLocal) {
          cell.classList.add('day-local');
        } else {
          cell.classList.add('day-viatico');
        }
        cell.onclick = () => mostrarDetalleDia(reg);
      } 

      grid.appendChild(cell);
    }
  } 

  function mostrarDetalleDia(reg) {
    const box = document.getElementById('detalleDia');
    box.innerHTML = `
      <strong>Fecha: ${reg.fecha}</strong><br>
      • Tren: ${reg.tren_prefijo} (Loc: ${reg.locomotora})<br>
      • Tomada: ${reg.lugar_tomada} -> Dejada: ${reg.lugar_dejada}<br>
      • Hs Extras: ${reg.horas_extras ? reg.horas_extras.toFixed(2) : 0} hs<br>
      • Viático Liquidador: ${reg.viatico_dias ? reg.viatico_dias.toFixed(2) + ' días' : 'Pendiente / En viaje'}
    `;
  }
</script> 

</body>
</html>
