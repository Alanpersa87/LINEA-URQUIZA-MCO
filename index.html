<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Trenes - Línea Urquiza</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --secondary-color: #28a745;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 5px;
    }

    .btn-cal {
      background-color: #6f42c1;
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85em;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    h1, h2 {
      text-align: center;
      color: var(--primary-color);
      margin: 0;
    }

    .section {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      background-color: #fafafa;
    }

    .section-title {
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      font-size: 1.1em;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .col {
      flex: 1;
      min-width: 130px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85em;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input, select, textarea {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.95em;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.95em;
      cursor: pointer;
      font-weight: bold;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-add {
      background-color: var(--secondary-color);
      margin-top: 6px;
    }

    .btn-save {
      background-color: #007bff;
      width: 100%;
      font-size: 1.1em;
      padding: 12px;
    }

    .btn-reset {
      background-color: #dc3545;
      width: 100%;
      margin-top: 8px;
    }

    .auv-item, .estacion-item {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .summary-box {
      background-color: #e9ecef;
      border: 1px solid #ced4da;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .history-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 0.9em;
    }

    /* MODAL GENERAL (CALENDARIO Y TRAMOS) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 16px;
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-top: 10px;
    }

    .cal-header {
      font-weight: bold;
      background: #eee;
      padding: 6px;
      font-size: 0.8em;
    }

    .cal-day {
      border: 1px solid #ddd;
      padding: 8px 2px;
      min-height: 40px;
      font-size: 0.85em;
      border-radius: 4px;
      cursor: pointer;
    }

    .cal-day.empty {
      background: #f9f9f9;
      border: none;
    }

    .day-local {
      background-color: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
      font-weight: bold;
    }

    .day-viatico {
      background-color: #ffe8d6;
      border-color: #ffd8be;
      color: #d97706;
      font-weight: bold;
    }

    .legend {
      display: flex;
      gap: 10px;
      font-size: 0.8em;
      margin-top: 10px;
      justify-content: center;
    }

    .badge {
      width: 12px;
      height: 12px;
      display: inline-block;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <button type="button" class="btn-cal" onclick="abrirCalendario()">📅 Calendario</button>
    <button type="button" class="btn-cal" style="background:#17a2b8;" onclick="abrirCalculadorTramos()">⏱️ Tiempos de Tramo</button>
    <h1 style="font-size: 1.1em; margin:0;">Registro de Trenes</h1>
  </div>

  <form id="registroForm">
    <!-- 1. DATOS GENERALES Y TOMADA DE SERVICIO -->
    <div class="section">
      <div class="section-title">1. Datos Generales y Tomada de Servicio</div>
      <div class="row">
        <div class="col">
          <label>Fecha:</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="col">
          <label>Hora:</label>
          <input type="time" id="hora" required>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>Lugar Tomada Servicio:</label>
          <select id="lugar_tomada" onchange="calcularServicio()">
            <option value="Concordia">Concordia (Residencia)</option>
            <option value="Monte Caseros">Monte Caseros</option>
            <option value="Basavilbaso">Basavilbaso</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="col">
          <label>Tomada de Servicio:</label>
          <input type="datetime-local" id="tomada_servicio" onchange="calcularServicio()">
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>Maquinista:</label>
          <input type="text" id="maquinista" placeholder="Nombre" required>
        </div>
        <div class="col">
          <label>Legajo Maq.:</label>
          <input type="text" id="legajo_maquinista" placeholder="N° Legajo" required>
        </div>
      </div>
      <div class="row">
        <div class="col">
